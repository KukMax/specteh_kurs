    (function () {
      'use strict';

      var STORAGE_KEY = 'course-rental-progress-v1';
      var DEFAULT_UNLOCKED = ['1-1', '1-2', '2-1', '2-2'];
      var MAX_ANSWER = 2000;

      /* ---------- Плоский список уроков и быстрый доступ по id ---------- */
      var ALL_LESSONS = [];
      var LESSON_INDEX = new Map();

      COURSE.modules.forEach(function (module, moduleIndex) {
        module.lessons.forEach(function (lesson, lessonIndex) {
          var entry = {
            lesson: lesson,
            module: module,
            moduleIndex: moduleIndex,
            lessonIndex: lessonIndex,
            order: ALL_LESSONS.length
          };
          ALL_LESSONS.push(entry);
          LESSON_INDEX.set(lesson.id, entry);
        });
      });

      var TOTAL = ALL_LESSONS.length;

      /* ---------- Состояние курса ---------- */
      var state = {
        currentLessonId: '1-1',
        completed: [],
        unlocked: DEFAULT_UNLOCKED.slice(),
        answers: {},
        drafts: {},
        completedAt: {}
      };

      var expandedModules = new Set([1, 2]);
      var player = { active: false, playing: false, elapsed: 0, duration: 0, timer: null, muted: false };
      var drawerOpen = false;
      var lastFocused = null;
      var saveTimer = null;

      var MODAL_TONES = {
        amber: 'bg-amber-50 text-amber-600 ring-amber-100',
        emerald: 'bg-emerald-50 text-emerald-600 ring-emerald-100',
        rose: 'bg-rose-50 text-rose-600 ring-rose-100',
        slate: 'bg-slate-100 text-slate-700 ring-slate-200'
      };

      /* ---------- Утилиты ---------- */
      function $(selector, root) {
        return (root || document).querySelector(selector);
      }

      function $$(selector, root) {
        return Array.prototype.slice.call((root || document).querySelectorAll(selector));
      }

      function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (character) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
        });
      }

      function refreshIcons() {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      }

      function formatTime(totalSeconds) {
        var safe = Math.max(0, Math.floor(totalSeconds || 0));
        var minutes = Math.floor(safe / 60);
        var seconds = safe % 60;
        return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
      }

      function parseDuration(value) {
        var parts = String(value || '0:00').split(':');
        var minutes = parseInt(parts[0], 10) || 0;
        var seconds = parseInt(parts[1], 10) || 0;
        return minutes * 60 + seconds;
      }

      function formatDate(value) {
        if (!value) return '';
        var date = new Date(value);
        if (isNaN(date.getTime())) return '';
        try {
          return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        } catch (error) {
          return '';
        }
      }

      /* ---------- Производные состояния ---------- */
      function isModuleUnlocked(module) {
        return module.lessons.some(function (lesson) {
          return state.unlocked.indexOf(lesson.id) !== -1;
        });
      }

      function completedCount() {
        return state.completed.filter(function (id) {
          return LESSON_INDEX.has(id);
        }).length;
      }

      function progressPercent() {
        if (!TOTAL) return 0;
        return Math.round((completedCount() / TOTAL) * 100);
      }

      function nextEntry(id) {
        var entry = LESSON_INDEX.get(id);
        if (!entry) return null;
        return ALL_LESSONS[entry.order + 1] || null;
      }

      function prevEntry(id) {
        var entry = LESSON_INDEX.get(id);
        if (!entry) return null;
        return ALL_LESSONS[entry.order - 1] || null;
      }

      function nextIncompleteEntry() {
        for (var i = 0; i < ALL_LESSONS.length; i += 1) {
          if (state.completed.indexOf(ALL_LESSONS[i].lesson.id) === -1) return ALL_LESSONS[i];
        }
        return null;
      }

      function getCurrentEntry() {
        return LESSON_INDEX.get(state.currentLessonId) || ALL_LESSONS[0];
      }

      function lockLabelFor(moduleId) {
        return moduleId > 1 ? 'После модуля ' + (moduleId - 1) : '';
      }

      /* ---------- Сохранение и восстановление ---------- */
      function saveState() {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (error) {
          /* Приватный режим или переполнение хранилища не должны ломать курс. */
        }
      }

      function scheduleSave() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(saveState, 350);
      }

      function loadState() {
        try {
          var raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object') return;

          var validIds = new Set(ALL_LESSONS.map(function (entry) { return entry.lesson.id; }));

          if (Array.isArray(parsed.completed)) {
            var completed = [];
            parsed.completed.forEach(function (id) {
              if (validIds.has(id) && completed.indexOf(id) === -1) completed.push(id);
            });
            state.completed = completed;
          }

          var unlocked = new Set(DEFAULT_UNLOCKED);
          if (Array.isArray(parsed.unlocked)) {
            parsed.unlocked.forEach(function (id) {
              if (validIds.has(id)) unlocked.add(id);
            });
          }
          state.completed.forEach(function (id) { unlocked.add(id); });
          ALL_LESSONS.forEach(function (entry, index) {
            if (state.completed.indexOf(entry.lesson.id) !== -1) {
              var following = ALL_LESSONS[index + 1];
              if (following) unlocked.add(following.lesson.id);
            }
          });
          state.unlocked = Array.from(unlocked);

          ['answers', 'drafts'].forEach(function (key) {
            var source = parsed[key];
            if (!source || typeof source !== 'object' || Array.isArray(source)) return;
            Object.keys(source).forEach(function (id) {
              if (validIds.has(id) && typeof source[id] === 'string') {
                state[key][id] = source[id].slice(0, MAX_ANSWER);
              }
            });
          });

          if (parsed.completedAt && typeof parsed.completedAt === 'object') {
            Object.keys(parsed.completedAt).forEach(function (id) {
              if (validIds.has(id) && typeof parsed.completedAt[id] === 'string') {
                state.completedAt[id] = parsed.completedAt[id];
              }
            });
          }

          if (typeof parsed.currentLessonId === 'string'
            && validIds.has(parsed.currentLessonId)
            && state.unlocked.indexOf(parsed.currentLessonId) !== -1) {
            state.currentLessonId = parsed.currentLessonId;
          }
        } catch (error) {
          /* Повреждённые данные игнорируем — стартуем с чистого прогресса. */
        }
      }

      function initExpanded() {
        var current = LESSON_INDEX.get(state.currentLessonId);
        if (current) expandedModules.add(current.module.id);
        COURSE.modules.forEach(function (module) {
          if (isModuleUnlocked(module)) expandedModules.add(module.id);
        });
      }

      /* ---------- Прогресс в шапке и сайдбаре ---------- */
      function renderProgress() {
        var done = completedCount();
        var percent = progressPercent();

        $$('[data-progress-bar]').forEach(function (bar) {
          bar.style.width = percent + '%';
        });
        $$('[data-progress-label]').forEach(function (label) {
          label.textContent = percent + '%';
        });
        $$('[data-progress-count]').forEach(function (label) {
          label.textContent = done + ' из ' + TOTAL + ' уроков';
        });

        var ring = document.getElementById('sidebarRingCircle');
        var ringLabel = document.getElementById('sidebarRingLabel');
        if (ring) {
          ring.setAttribute('stroke-dasharray', '150.8');
          ring.setAttribute('stroke-dashoffset', String(150.8 * (1 - percent / 100)));
        }
        if (ringLabel) ringLabel.textContent = percent + '%';
      }

      /* ---------- Сайдбар ---------- */
      function moduleStatus(module) {
        var done = module.lessons.filter(function (lesson) {
          return state.completed.indexOf(lesson.id) !== -1;
        }).length;
        if (done === module.lessons.length) return 'done';
        return isModuleUnlocked(module) ? 'active' : 'locked';
      }

      function moduleHeader(module) {
        var status = moduleStatus(module);
        var unlocked = status !== 'locked';
        var expanded = unlocked && expandedModules.has(module.id);
        var doneCount = module.lessons.filter(function (lesson) {
          return state.completed.indexOf(lesson.id) !== -1;
        }).length;
        var statusLabel = status === 'done' ? 'Пройден' : status === 'active' ? 'Активен' : 'Заблокирован';
        var badgeClass = status === 'done'
          ? 'bg-emerald-400/10 text-emerald-300 ring-1 ring-inset ring-emerald-400/20'
          : status === 'active'
            ? 'bg-gradient-to-br from-amber-300 to-orange-500 text-slate-950 shadow-lg shadow-amber-500/20'
            : 'bg-white/[0.04] text-slate-500 ring-1 ring-inset ring-white/[0.06]';
        var pillClass = status === 'done'
          ? 'bg-emerald-400/10 text-emerald-300 ring-1 ring-inset ring-emerald-400/20'
          : status === 'active'
            ? 'bg-amber-400/10 text-amber-300 ring-1 ring-inset ring-amber-400/20'
            : 'bg-white/[0.04] text-slate-500 ring-1 ring-inset ring-white/[0.06]';
        var meta = status === 'locked'
          ? lockLabelFor(module.id)
          : module.lessons.length + ' урока · ' + doneCount + ' из ' + module.lessons.length;
        var marker = unlocked
          ? '<i data-lucide="chevron-down" class="mt-1 h-3.5 w-3.5 shrink-0 text-slate-500 transition-transform duration-200 ' + (expanded ? 'rotate-180' : '') + '"></i>'
          : '<i data-lucide="lock" class="mt-1 h-3.5 w-3.5 shrink-0 text-slate-600"></i>';

        return '<button type="button" data-action="toggle-module" data-module-id="' + module.id + '" aria-expanded="' + (expanded ? 'true' : 'false') + '" class="group flex w-full items-start gap-2.5 px-2.5 py-2.5 text-left transition ' + (unlocked ? 'hover:bg-white/[0.03]' : 'cursor-pointer opacity-80') + '">'
          + '<span class="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-lg font-display text-[10.5px] font-extrabold ' + badgeClass + '">' + String(module.id).padStart(2, '0') + '</span>'
          + '<span class="min-w-0 flex-1">'
            + '<span class="block text-[11px] font-semibold leading-snug ' + (unlocked ? 'text-slate-100' : 'text-slate-400') + '">' + esc(module.title) + '</span>'
            + '<span class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1">'
              + '<span class="text-[9px] text-slate-500">' + esc(meta) + '</span>'
              + '<span class="rounded-full px-1.5 py-0.5 text-[8px] font-semibold uppercase tracking-wider ' + pillClass + '">' + statusLabel + '</span>'
            + '</span>'
          + '</span>'
          + marker
        + '</button>';
      }

      function lessonRow(entry) {
        var lesson = entry.lesson;
        var isCompleted = state.completed.indexOf(lesson.id) !== -1;
        var isCurrent = state.currentLessonId === lesson.id;
        var isUnlocked = state.unlocked.indexOf(lesson.id) !== -1;
        var statusIcon;

        if (isCompleted) {
          statusIcon = '<span class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full bg-emerald-400/15 text-emerald-300 ring-1 ring-inset ring-emerald-400/20"><i data-lucide="check" class="h-2.5 w-2.5"></i></span>';
        } else if (isCurrent) {
          statusIcon = '<span class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full bg-amber-400 text-slate-950"><span class="h-1.5 w-1.5 rounded-full bg-slate-950"></span></span>';
        } else if (isUnlocked) {
          statusIcon = '<span class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border border-slate-600"><span class="h-1 w-1 rounded-full bg-slate-500"></span></span>';
        } else {
          statusIcon = '<span class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center"><i data-lucide="lock" class="h-3 w-3 text-slate-600"></i></span>';
        }

        return '<button type="button" data-action="select-lesson" data-lesson-id="' + lesson.id + '" aria-current="' + (isCurrent ? 'true' : 'false') + '" aria-disabled="' + (isUnlocked ? 'false' : 'true') + '" class="group flex w-full items-start gap-2 rounded-lg px-2 py-2 text-left transition ' + (isCurrent ? 'bg-amber-400/[0.09] ring-1 ring-inset ring-amber-400/20' : 'hover:bg-white/[0.04]') + (isUnlocked ? '' : ' opacity-60') + '">'
          + statusIcon
          + '<span class="min-w-0 flex-1">'
            + '<span class="block text-[8.5px] font-semibold uppercase tracking-[0.14em] ' + (isCurrent ? 'text-amber-400' : 'text-slate-500') + '">Урок ' + esc(lesson.code) + '</span>'
            + '<span class="mt-0.5 block text-[10.5px] leading-snug ' + (isCurrent ? 'text-white' : isCompleted ? 'text-slate-400' : isUnlocked ? 'text-slate-300' : 'text-slate-500') + '">' + esc(lesson.title) + '</span>'
          + '</span>'
          + '<span class="mt-0.5 shrink-0 text-[8.5px] tabular-nums ' + (isCurrent ? 'text-amber-400/80' : 'text-slate-600') + '">' + esc(lesson.duration) + '</span>'
        + '</button>';
      }

      function renderSidebar() {
        var nav = document.getElementById('courseNav');
        if (!nav) return;

        nav.innerHTML = COURSE.modules.map(function (module) {
          var status = moduleStatus(module);
          var unlocked = status !== 'locked';
          var expanded = unlocked && expandedModules.has(module.id);
          var lessons = expanded
            ? '<div class="space-y-0.5 border-t border-white/[0.05] px-2 pb-2 pt-1.5">'
                + module.lessons.map(function (lesson) {
                    return lessonRow(LESSON_INDEX.get(lesson.id));
                  }).join('')
              + '</div>'
            : '';
          var lockNote = !unlocked
            ? '<div class="mx-2.5 mb-2 flex items-center gap-1.5 rounded-lg bg-white/[0.02] px-2.5 py-1.5 text-[9px] text-slate-500"><i data-lucide="lock" class="h-2.5 w-2.5"></i>' + esc(lockLabelFor(module.id)) + '</div>'
            : '';

          return '<div class="overflow-hidden rounded-xl border transition-colors ' + (expanded ? 'border-white/[0.08] bg-white/[0.03]' : 'border-white/[0.03]') + '">'
            + moduleHeader(module)
            + lessons
            + lockNote
          + '</div>';
        }).join('');

        refreshIcons();
      }

      /* ---------- Блоки урока ---------- */
      function lessonHeader(entry, isCompleted) {
        var lesson = entry.lesson;
        var module = entry.module;
        var doneChip = isCompleted
          ? '<span class="inline-flex items-center gap-1 rounded-full bg-emerald-50 px-2.5 py-1 text-[10px] font-semibold text-emerald-700 ring-1 ring-inset ring-emerald-200/70"><i data-lucide="check" class="h-3 w-3"></i>Завершён</span>'
          : '';

        return '<div class="animate-fade-up">'
          + '<div class="flex flex-wrap items-center gap-2 text-[11px]">'
            + '<span class="inline-flex max-w-full items-center gap-1.5 rounded-full bg-white px-3 py-1.5 font-medium text-slate-600 shadow-sm ring-1 ring-slate-200/70">'
              + '<i data-lucide="layers" class="h-3.5 w-3.5 shrink-0 text-amber-500"></i>'
              + '<span class="truncate">Модуль ' + module.id + ' · ' + esc(module.title) + '</span>'
            + '</span>'
            + '<span class="text-slate-300">/</span>'
            + '<span class="text-slate-500">Урок ' + esc(lesson.code) + '</span>'
            + doneChip
          + '</div>'
          + '<div class="mt-4 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">'
            + '<div class="max-w-2xl">'
              + '<p class="text-[10px] font-semibold uppercase tracking-[0.22em] text-amber-600">Урок ' + esc(lesson.code) + ' · ' + esc(lesson.level) + '</p>'
              + '<h2 id="lessonTitle" tabindex="-1" class="text-balance mt-2 font-display text-[25px] font-extrabold leading-[1.15] tracking-tight text-slate-900 outline-none sm:text-[30px] lg:text-[33px]">' + esc(lesson.title) + '</h2>'
            + '</div>'
            + '<div class="flex flex-wrap items-center gap-2">'
              + '<span class="inline-flex items-center gap-1.5 rounded-lg bg-white px-2.5 py-1.5 text-[10.5px] font-medium text-slate-600 ring-1 ring-slate-200/70"><i data-lucide="clock" class="h-3.5 w-3.5 text-slate-400"></i>' + esc(lesson.duration) + '</span>'
              + '<span class="inline-flex items-center gap-1.5 rounded-lg bg-white px-2.5 py-1.5 text-[10.5px] font-medium text-slate-600 ring-1 ring-slate-200/70"><i data-lucide="bar-chart-2" class="h-3.5 w-3.5 text-slate-400"></i>' + esc(lesson.level) + '</span>'
              + '<span class="inline-flex items-center gap-1.5 rounded-lg bg-white px-2.5 py-1.5 text-[10.5px] font-medium text-slate-600 ring-1 ring-slate-200/70"><i data-lucide="file-text" class="h-3.5 w-3.5 text-slate-400"></i>Домашнее задание</span>'
            + '</div>'
          + '</div>'
        + '</div>';
      }

      function videoBlock(lesson) {
        return '<div class="animate-fade-up mt-5 overflow-hidden rounded-2xl bg-slate-950 shadow-float ring-1 ring-slate-950/10">'
          + '<div data-player class="blueprint-grid relative aspect-video w-full overflow-hidden bg-gradient-to-br from-slate-900 via-slate-950 to-black">'
            + '<div class="pointer-events-none absolute -right-24 -top-24 h-64 w-64 rounded-full bg-amber-500/10 blur-3xl"></div>'
            + '<div class="pointer-events-none absolute -bottom-28 -left-20 h-64 w-64 rounded-full bg-orange-600/10 blur-3xl"></div>'
            + '<div class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_20%,rgba(2,6,23,.55)_100%)]"></div>'

            + '<div class="absolute left-3 top-3 z-20 flex flex-wrap items-center gap-2 sm:left-4 sm:top-4">'
              + '<span class="inline-flex items-center gap-1.5 rounded-full bg-black/40 px-2.5 py-1 text-[10px] font-medium text-white ring-1 ring-inset ring-white/10 backdrop-blur"><span class="h-1.5 w-1.5 rounded-full bg-amber-400"></span>Видеоурок</span>'
              + '<span class="rounded-full bg-black/40 px-2 py-1 text-[9px] font-semibold uppercase tracking-wider text-slate-300 ring-1 ring-inset ring-white/10">HD</span>'
            + '</div>'

            + '<div data-player-overlay class="absolute inset-0 z-10 flex flex-col items-center justify-center gap-4 transition-opacity duration-300">'
              + '<button type="button" data-action="play-video" aria-label="Воспроизвести видеоурок" class="group relative flex h-16 w-16 items-center justify-center rounded-full bg-gradient-to-br from-amber-300 to-orange-500 text-slate-950 shadow-2xl shadow-amber-500/30 transition duration-300 hover:scale-105 hover:shadow-amber-500/50 sm:h-20 sm:w-20">'
                + '<span class="absolute inset-0 rounded-full ring-1 ring-inset ring-white/30"></span>'
                + '<span class="absolute -inset-2 rounded-full border border-amber-400/20"></span>'
                + '<svg viewBox="0 0 24 24" class="ml-1 h-6 w-6 sm:h-7 sm:w-7" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11-6.86a1 1 0 0 0 0-1.7l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>'
              + '</button>'
              + '<div class="text-center">'
                + '<p data-player-label class="font-display text-sm font-bold text-white">Смотреть урок</p>'
                + '<p class="mt-1 text-[11px] text-slate-400">' + esc(lesson.duration) + ' · ' + esc(lesson.level) + '</p>'
              + '</div>'
            + '</div>'

            + '<div class="absolute inset-x-0 bottom-0 z-20 bg-gradient-to-t from-black/90 via-black/55 to-transparent px-3 pb-3 pt-12 sm:px-4">'
              + '<div class="flex items-center gap-2.5 sm:gap-3">'
                + '<button type="button" data-action="toggle-video" aria-label="Пауза или воспроизведение" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-white transition hover:bg-white/10">'
                  + '<span data-player-play-icon><i data-lucide="play" class="h-4 w-4"></i></span>'
                  + '<span data-player-pause-icon class="hidden"><i data-lucide="pause" class="h-4 w-4"></i></span>'
                + '</button>'
                + '<div data-action="seek" role="slider" tabindex="0" aria-label="Позиция воспроизведения" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" class="group relative flex h-5 flex-1 cursor-pointer items-center">'
                  + '<div class="h-1.5 w-full overflow-hidden rounded-full bg-white/20"><div data-player-bar class="h-full w-0 rounded-full bg-gradient-to-r from-amber-400 to-orange-500"></div></div>'
                  + '<span data-player-knob class="pointer-events-none absolute left-0 top-1/2 h-3 w-3 -translate-x-1/2 -translate-y-1/2 rounded-full bg-amber-400 opacity-0 shadow transition-opacity group-hover:opacity-100"></span>'
                + '</div>'
                + '<span class="shrink-0 font-mono text-[10px] tabular-nums text-slate-300"><span data-player-elapsed>00:00</span><span class="text-slate-500"> / ' + esc(lesson.duration) + '</span></span>'
                + '<button type="button" data-action="toggle-mute" aria-label="Звук" class="hidden h-8 w-8 shrink-0 items-center justify-center rounded-full text-slate-300 transition hover:bg-white/10 hover:text-white sm:flex">'
                  + '<span data-mute-on><i data-lucide="volume-2" class="h-4 w-4"></i></span>'
                  + '<span data-mute-off class="hidden"><i data-lucide="volume-x" class="h-4 w-4"></i></span>'
                + '</button>'
                + '<button type="button" data-action="fullscreen" aria-label="Полный экран" class="hidden h-8 w-8 shrink-0 items-center justify-center rounded-full text-slate-300 transition hover:bg-white/10 hover:text-white sm:flex"><i data-lucide="maximize" class="h-4 w-4"></i></button>'
              + '</div>'
            + '</div>'
          + '</div>'
        + '</div>';
      }

      function introBlock(lesson) {
        return '<div class="mt-4 flex gap-3.5 rounded-2xl bg-white p-5 shadow-soft ring-1 ring-slate-200/60">'
          + '<span class="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-amber-50 text-amber-600 ring-1 ring-amber-100"><i data-lucide="target" class="h-4 w-4"></i></span>'
          + '<p class="text-[13.5px] leading-relaxed text-slate-600 sm:text-[14px]">' + esc(lesson.intro) + '</p>'
        + '</div>';
      }

      function statsBlock(lesson) {
        if (!Array.isArray(lesson.stats) || !lesson.stats.length) return '';
        return '<div class="mt-3 grid gap-3 sm:grid-cols-3">'
          + lesson.stats.map(function (stat) {
              return '<div class="rounded-2xl bg-white p-4 shadow-soft ring-1 ring-slate-200/60">'
                + '<span class="flex h-8 w-8 items-center justify-center rounded-lg bg-slate-900 text-amber-400"><i data-lucide="' + esc(stat.icon) + '" class="h-4 w-4"></i></span>'
                + '<p class="mt-3 font-display text-[17px] font-extrabold tracking-tight text-slate-900">' + esc(stat.value) + '</p>'
                + '<p class="mt-1 text-[10.5px] leading-snug text-slate-500">' + esc(stat.label) + '</p>'
              + '</div>';
            }).join('')
        + '</div>';
      }

      function sectionsBlock(lesson) {
        if (!Array.isArray(lesson.sections)) return '';
        return '<div class="mt-7">'
          + lesson.sections.map(function (section, index) {
              var paragraphs = (section.paragraphs || []).map(function (paragraph) {
                return '<p class="mt-3 text-[13.5px] leading-[1.8] text-slate-600 sm:text-[14px]">' + esc(paragraph) + '</p>';
              }).join('');
              var list = Array.isArray(section.list) && section.list.length
                ? '<ul class="mt-3.5 space-y-2.5">' + section.list.map(function (item) {
                    return '<li class="flex gap-3 text-[13px] leading-relaxed text-slate-600 sm:text-[13.5px]"><span class="mt-[7px] h-1.5 w-1.5 shrink-0 rounded-full bg-amber-500"></span><span>' + esc(item) + '</span></li>';
                  }).join('') + '</ul>'
                : '';

              return '<section class="mt-6 first:mt-0">'
                + '<div class="flex items-center gap-3">'
                  + '<span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-slate-900 font-display text-[10.5px] font-bold text-white">' + String(index + 1).padStart(2, '0') + '</span>'
                  + '<h3 class="font-display text-[16.5px] font-bold leading-snug text-slate-900 sm:text-lg">' + esc(section.title) + '</h3>'
                + '</div>'
                + paragraphs
                + list
              + '</section>';
            }).join('')
        + '</div>';
      }

      function tableBlock(table) {
        if (!table || !Array.isArray(table.rows) || !table.rows.length) return '';
        var head = table.head.map(function (cell) {
          return '<th scope="col" class="whitespace-nowrap px-4 py-3 text-[9.5px] font-semibold uppercase tracking-[0.12em] text-slate-400">' + esc(cell) + '</th>';
        }).join('');
        var rows = table.rows.map(function (row, rowIndex) {
          var highlight = table.highlightLast && rowIndex === table.rows.length - 1;
          var cells = row.map(function (cell, cellIndex) {
            return '<td class="px-4 py-3 ' + (cellIndex === 0 ? 'font-medium text-slate-800' : 'text-slate-600') + '">' + esc(cell) + '</td>';
          }).join('');
          return '<tr class="' + (highlight ? 'bg-amber-50/70' : 'transition-colors hover:bg-slate-50/80') + '">' + cells + '</tr>';
        }).join('');

        return '<figure class="mt-8 overflow-hidden rounded-2xl bg-white shadow-soft ring-1 ring-slate-200/70">'
          + '<figcaption class="flex items-center gap-2 border-b border-slate-200/70 bg-slate-50/80 px-4 py-3 text-[10px] font-semibold uppercase tracking-wider text-slate-500 sm:px-5">'
            + '<i data-lucide="table" class="h-3.5 w-3.5 text-slate-400"></i>' + esc(table.caption || 'Таблица')
          + '</figcaption>'
          + '<div class="scrollbar-thin overflow-x-auto">'
            + '<table class="w-full min-w-[520px] text-left text-[12px]">'
              + '<thead><tr class="border-b border-slate-100 bg-white">' + head + '</tr></thead>'
              + '<tbody class="divide-y divide-slate-100">' + rows + '</tbody>'
            + '</table>'
          + '</div>'
        + '</figure>';
      }

      function tipBlock(tip) {
        if (!tip) return '';
        return '<aside class="mt-8 flex gap-3.5 rounded-2xl border border-amber-200/70 bg-gradient-to-br from-amber-50 to-orange-50/50 p-5">'
          + '<span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-amber-400 text-slate-950 shadow-sm"><i data-lucide="lightbulb" class="h-4 w-4"></i></span>'
          + '<div class="min-w-0">'
            + '<p class="text-[9.5px] font-bold uppercase tracking-[0.18em] text-amber-700">Совет эксперта</p>'
            + '<p class="mt-1.5 text-[13px] leading-relaxed text-amber-950/80 sm:text-[13.5px]">' + esc(tip) + '</p>'
          + '</div>'
        + '</aside>';
      }

      function takeawaysBlock(takeaways) {
        if (!Array.isArray(takeaways) || !takeaways.length) return '';
        return '<section class="mt-6 overflow-hidden rounded-2xl bg-slate-950 p-5 text-white shadow-float ring-1 ring-white/10 sm:p-6">'
          + '<div class="flex items-center gap-2.5">'
            + '<span class="flex h-7 w-7 items-center justify-center rounded-lg bg-amber-400/15 text-amber-400"><i data-lucide="award" class="h-4 w-4"></i></span>'
            + '<h3 class="font-display text-[13px] font-bold uppercase tracking-[0.12em] text-white">Главное из урока</h3>'
          + '</div>'
          + '<ul class="mt-4 grid gap-2.5 sm:grid-cols-2">'
            + takeaways.map(function (item) {
                return '<li class="flex gap-2.5 rounded-xl bg-white/[0.04] p-3 text-[11.5px] leading-relaxed text-slate-300 ring-1 ring-inset ring-white/[0.04]"><i data-lucide="check" class="mt-0.5 h-3.5 w-3.5 shrink-0 text-amber-400"></i><span>' + esc(item) + '</span></li>';
              }).join('')
          + '</ul>'
        + '</section>';
      }

      function homeworkBlock(entry) {
        var lesson = entry.lesson;
        var isCompleted = state.completed.indexOf(lesson.id) !== -1;
        if (isCompleted) return homeworkDoneBlock(entry);

        var draft = state.drafts[lesson.id] || state.answers[lesson.id] || '';
        return '<section id="homework" class="mt-8 scroll-mt-6">'
          + '<div class="overflow-hidden rounded-2xl bg-white shadow-soft ring-1 ring-slate-200/70">'
            + '<div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 px-5 py-4 sm:px-6">'
              + '<div class="flex items-center gap-3">'
                + '<span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-slate-900 text-amber-400"><i data-lucide="pen-line" class="h-4 w-4"></i></span>'
                + '<div class="min-w-0">'
                  + '<h3 class="font-display text-[14.5px] font-bold text-slate-900">Домашнее задание</h3>'
                  + '<p class="mt-0.5 text-[10.5px] text-slate-500">Практика · закрепите материал перед следующим уроком</p>'
                + '</div>'
              + '</div>'
              + '<span class="inline-flex items-center gap-1.5 rounded-full bg-amber-50 px-2.5 py-1 text-[9.5px] font-semibold uppercase tracking-wider text-amber-700 ring-1 ring-inset ring-amber-200/70"><span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>Не сдано</span>'
            + '</div>'
            + '<div class="p-5 sm:p-6">'

            + '</div>'
          + '</div>'

      function homeworkDoneBlock(entry) {
        var lesson = entry.lesson;
        var following = nextEntry(lesson.id);
        var answer = state.answers[lesson.id] || '';
        var date = formatDate(state.completedAt[lesson.id]);
        var allDone = completedCount() === TOTAL;

        var answerBlock = answer
          ? '<div class="mt-4 whitespace-pre-line rounded-xl bg-slate-50 p-4 text-[12.5px] leading-relaxed text-slate-700 ring-1 ring-inset ring-slate-200/60">' + esc(answer) + '</div>'
          : '<p class="mt-4 rounded-xl bg-slate-50 p-4 text-[12px] italic leading-relaxed text-slate-400 ring-1 ring-inset ring-slate-200/60">Ответ не добавлен — задание сдано без текста.</p>';

        var action;
        if (following) {
          action = '<button type="button" data-action="select-lesson" data-lesson-id="' + following.lesson.id + '" class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-slate-950 px-5 py-3 text-[12px] font-semibold text-white transition hover:bg-slate-800 sm:w-auto">'
            + 'Следующий урок: ' + esc(following.lesson.code)
            + '<i data-lucide="arrow-right" class="h-4 w-4"></i>'
          + '</button>';
        } else {
          action = '<button type="button" data-action="reset-progress" class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-slate-950 px-5 py-3 text-[12px] font-semibold text-white transition hover:bg-slate-800 sm:w-auto">'
            + 'Пройти курс заново'
            + '<i data-lucide="rotate-ccw" class="h-4 w-4"></i>'
          + '</button>';
        }

        var finishBlock = allDone
          ? '<div class="mt-4 flex items-start gap-3 rounded-xl bg-amber-50 p-3.5 ring-1 ring-inset ring-amber-200/70">'
              + '<i data-lucide="trophy" class="mt-0.5 h-4 w-4 shrink-0 text-amber-600"></i>'
              + '<p class="text-[11.5px] leading-relaxed text-amber-900">Курс завершён: все ' + TOTAL + ' уроков пройдены. Самое время применить финансовую модель на реальной технике.</p>'
            + '</div>'
          : '';

        return '<section id="homework" class="mt-8 scroll-mt-6">'
          + '<div class="overflow-hidden rounded-2xl bg-white shadow-soft ring-1 ring-emerald-200/80">'
            + '<div class="flex flex-wrap items-center justify-between gap-3 border-b border-emerald-100 bg-emerald-50/70 px-5 py-4 sm:px-6">'
              + '<div class="flex items-center gap-3">'
                + '<span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-emerald-500 text-white shadow-sm"><i data-lucide="check" class="h-4 w-4"></i></span>'
                + '<div class="min-w-0">'
                  + '<h3 class="font-display text-[14.5px] font-bold text-slate-900">Домашнее задание</h3>'
                  + '<p class="mt-0.5 text-[10.5px] text-emerald-700">' + (date ? 'Сдано ' + esc(date) : 'Задание зачтено') + '</p>'
                + '</div>'
              + '</div>'
              + '<span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-100 px-2.5 py-1 text-[9.5px] font-semibold uppercase tracking-wider text-emerald-700 ring-1 ring-inset ring-emerald-200"><i data-lucide="check" class="h-3 w-3"></i>Зачтено</span>'
            + '</div>'
            + '<div class="p-5 sm:p-6">'
              + '<p class="text-[12.5px] leading-relaxed text-slate-500">' + esc(lesson.homework.prompt) + '</p>'
              + '<p class="mt-3 text-[9.5px] font-semibold uppercase tracking-[0.16em] text-slate-400">Ваш ответ</p>'
              + answerBlock
              + finishBlock
              + '<div class="mt-5">' + action + '</div>'
            + '</div>'
          + '</div>'
        + '</section>';
      }

      function navBlock(entry, previous, following) {
        var previousButton = previous
          ? '<button type="button" data-action="select-lesson" data-lesson-id="' + previous.lesson.id + '" class="group flex items-center gap-3 rounded-xl border border-slate-200 bg-white px-4 py-3 text-left shadow-sm transition hover:border-slate-300 hover:shadow-soft">'
              + '<i data-lucide="arrow-left" class="h-4 w-4 shrink-0 text-slate-400 transition group-hover:-translate-x-0.5"></i>'
              + '<span class="min-w-0">'
                + '<span class="block text-[9px] font-semibold uppercase tracking-wider text-slate-400">Предыдущий урок</span>'
                + '<span class="mt-0.5 block max-w-[180px] truncate text-[11.5px] font-semibold text-slate-700">' + esc(previous.lesson.title) + '</span>'
              + '</span>'
            + '</button>'
          : '<span class="hidden sm:block"></span>';

        var nextButton = '';
        if (following) {
          var nextUnlocked = state.unlocked.indexOf(following.lesson.id) !== -1;
          nextButton = '<button type="button" data-action="select-lesson" data-lesson-id="' + following.lesson.id + '" class="group flex items-center justify-end gap-3 rounded-xl px-4 py-3 text-right transition ' + (nextUnlocked ? 'bg-slate-950 text-white shadow-lg shadow-slate-950/10 hover:bg-slate-800' : 'border border-slate-200 bg-white text-slate-400 hover:border-slate-300') + '">'
            + '<span class="min-w-0">'
              + '<span class="block text-[9px] font-semibold uppercase tracking-wider ' + (nextUnlocked ? 'text-amber-400' : 'text-slate-400') + '">Следующий урок</span>'
              + '<span class="mt-0.5 block max-w-[180px] truncate text-[11.5px] font-semibold">' + esc(following.lesson.title) + '</span>'
            + '</span>'
            + '<i data-lucide="' + (nextUnlocked ? 'arrow-right' : 'lock') + '" class="h-4 w-4 shrink-0 ' + (nextUnlocked ? 'text-amber-400 transition group-hover:translate-x-0.5' : 'text-slate-400') + '"></i>'
          + '</button>';
        } else {
          nextButton = '<span class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-3 text-[11px] font-semibold text-slate-500"><i data-lucide="trophy" class="h-4 w-4 text-amber-500"></i>Финальный урок курса</span>';
        }

        return '<div class="mt-8 flex flex-col-reverse items-stretch gap-3 border-t border-slate-200/80 pt-5 sm:flex-row sm:items-center sm:justify-between">'
          + previousButton
          + '<span class="hidden text-[10px] font-medium uppercase tracking-[0.16em] text-slate-400 lg:block">Урок ' + (entry.order + 1) + ' из ' + TOTAL + '</span>'
          + nextButton
        + '</div>';
      }

      function asideBlock(entry, following) {
        var lesson = entry.lesson;
        var percent = progressPercent();
        var done = completedCount();
        var nextHtml = following
          ? '<div class="mt-3 flex items-start gap-2.5 rounded-xl bg-white/[0.05] p-3 ring-1 ring-inset ring-white/[0.06]">'
              + '<span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-md bg-amber-400/15 text-[9.5px] font-bold text-amber-300">' + esc(following.lesson.code) + '</span>'
              + '<span class="min-w-0">'
                + '<span class="block text-[8.5px] uppercase tracking-wider text-slate-500">Следующий урок</span>'
                + '<span class="mt-0.5 block text-[10.5px] leading-snug text-slate-300">' + esc(following.lesson.title) + '</span>'
              + '</span>'
            + '</div>'
          : '<p class="mt-3 rounded-xl bg-white/[0.05] p-3 text-[10.5px] leading-relaxed text-slate-400 ring-1 ring-inset ring-white/[0.06]">Это последний урок курса. Завершите его, чтобы закрыть программу полностью.</p>';

        return '<aside data-lesson-aside class="hidden xl:block">'
          + '<div class="sticky top-0 space-y-4">'
            + '<div class="rounded-2xl bg-white p-5 shadow-soft ring-1 ring-slate-200/70">'
              + '<p class="text-[9.5px] font-semibold uppercase tracking-[0.2em] text-slate-400">Этот урок</p>'
              + '<dl class="mt-3 space-y-2.5 text-[11.5px]">'
                + '<div class="flex items-center justify-between gap-3"><dt class="text-slate-500">Длительность</dt><dd class="font-semibold text-slate-800">' + esc(lesson.duration) + '</dd></div>'
                + '<div class="flex items-center justify-between gap-3"><dt class="text-slate-500">Уровень</dt><dd class="font-semibold text-slate-800">' + esc(lesson.level) + '</dd></div>'
                + '<div class="flex items-center justify-between gap-3"><dt class="text-slate-500">Формат</dt><dd class="font-semibold text-slate-800">Видео + практика</dd></div>'
                + '<div class="flex items-center justify-between gap-3"><dt class="text-slate-500">Домашнее задание</dt><dd class="font-semibold text-emerald-600">Есть</dd></div>'
              + '</dl>'
              + '<div class="my-4 h-px bg-slate-100"></div>'
              + '<p class="text-[10.5px] leading-relaxed text-slate-500">Сначала посмотрите видео, затем выполните задание — так материал закрепляется лучше.</p>'
              + '<button type="button" data-action="scroll-homework" class="mt-3.5 flex w-full items-center justify-center gap-2 rounded-xl bg-slate-950 px-4 py-2.5 text-[11px] font-semibold text-white transition hover:bg-slate-800">Перейти к заданию<i data-lucide="arrow-right" class="h-3.5 w-3.5 text-amber-400"></i></button>'
            + '</div>'
            + '<div class="rounded-2xl bg-slate-950 p-5 text-white shadow-float ring-1 ring-white/10">'
              + '<div class="flex items-center justify-between">'
                + '<p class="text-[9.5px] font-semibold uppercase tracking-[0.2em] text-slate-400">Ваш прогресс</p>'
                + '<span class="font-display text-sm font-extrabold text-amber-400">' + percent + '%</span>'
              + '</div>'
              + '<div class="mt-3 h-1.5 overflow-hidden rounded-full bg-white/10"><div class="h-full rounded-full bg-gradient-to-r from-amber-400 to-orange-500" style="width:' + percent + '%"></div></div>'
              + '<p class="mt-2 text-[10px] text-slate-400">Пройдено ' + done + ' из ' + TOTAL + ' уроков</p>'
              + nextHtml
            + '</div>'
          + '</div>'
        + '</aside>';
      }

      /* ---------- Рендер урока ---------- */
      function renderLesson() {
        var entry = getCurrentEntry();
        if (!entry) return;
        var isCompleted = state.completed.indexOf(entry.lesson.id) !== -1;
        var following = nextEntry(entry.lesson.id);
        var previous = prevEntry(entry.lesson.id);
        var view = document.getElementById('lessonView');
        if (!view) return;

        stopPlayer();
        player = {
          active: false,
          playing: false,
          elapsed: 0,
          duration: parseDuration(entry.lesson.duration),
          timer: null,
          muted: false
        };

        view.innerHTML = [
          lessonHeader(entry, isCompleted),
          '<div class="mt-5 grid items-start gap-6 xl:grid-cols-[minmax(0,1fr)_300px]">',
            '<div class="min-w-0">',
              videoBlock(entry.lesson),
              introBlock(entry.lesson),
              statsBlock(entry.lesson),
              sectionsBlock(entry.lesson),
              tableBlock(entry.lesson.table),
              tipBlock(entry.lesson.tip),
              takeawaysBlock(entry.lesson.takeaways),
              homeworkBlock(entry),
              navBlock(entry, previous, following),
            '</div>',
            asideBlock(entry, following),
          '</div>'
        ].join('');

        refreshIcons();
        updatePlayerUI();
      }

      function renderAll() {
        renderSidebar();
        renderProgress();
        renderLesson();
      }

      /* ---------- Модальные окна ---------- */
      function showModal(config) {
        var root = document.getElementById('modalRoot');
        if (!root) return;
        var actions = (config.actions || []).map(function (action) {
          var variantClass = action.variant === 'primary'
            ? 'bg-slate-950 text-white hover:bg-slate-800'
            : action.variant === 'danger'
              ? 'bg-rose-600 text-white hover:bg-rose-500'
              : 'border border-slate-200 bg-white text-slate-600 hover:border-slate-300 hover:bg-slate-50';
          return '<button type="button" data-action="' + action.action + '" data-modal-button class="inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-[12px] font-semibold transition ' + variantClass + '">' + esc(action.label) + '</button>';
        }).join('');

        lastFocused = document.activeElement;
        root.innerHTML = '<div class="fixed inset-0 z-[70] flex items-end justify-center p-4 sm:items-center" role="dialog" aria-modal="true" aria-labelledby="modalTitle">'
          + '<div class="absolute inset-0 animate-fade bg-slate-950/60 backdrop-blur-sm" data-action="close-modal"></div>'
          + '<div class="relative z-10 w-full max-w-md animate-pop overflow-hidden rounded-2xl bg-white shadow-2xl ring-1 ring-black/5">'
            + '<div class="p-5 sm:p-6">'
              + '<div class="flex items-start gap-4">'
                + '<span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl ring-1 ring-inset ' + (MODAL_TONES[config.tone] || MODAL_TONES.amber) + '"><i data-lucide="' + (config.icon || 'lock') + '" class="h-5 w-5"></i></span>'
                + '<div class="min-w-0 flex-1">'
                  + '<h2 id="modalTitle" class="font-display text-[17px] font-bold leading-snug text-slate-900">' + esc(config.title) + '</h2>'
                  + '<p class="mt-2 text-[12.5px] leading-relaxed text-slate-500">' + esc(config.text) + '</p>'
                + '</div>'
              + '</div>'
              + (config.body || '')
              + '<div class="mt-5 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">' + actions + '</div>'
            + '</div>'
          + '</div>'
        + '</div>';

        refreshIcons();
        var focusTarget = root.querySelector('[data-modal-button]');
        if (focusTarget) focusTarget.focus({ preventScroll: true });
      }

      function closeModal() {
        var root = document.getElementById('modalRoot');
        if (!root || !root.innerHTML) return;
        root.innerHTML = '';
        if (lastFocused && lastFocused.isConnected) {
          lastFocused.focus({ preventScroll: true });
        }
        lastFocused = null;
      }

      function showLockedModal(kind, id) {
        if (kind === 'module') {
          var module = COURSE.modules.find(function (item) { return item.id === id; });
          if (!module) return;
          showModal({
            icon: 'lock',
            title: 'Модуль пока закрыт',
            text: 'Модуль ' + module.id + ' «' + module.title + '» откроется, когда вы завершите все уроки модуля ' + (module.id - 1) + '. Прогресс сохраняется — продолжайте с доступных уроков.',
            actions: [{ label: 'Понятно', action: 'close-modal', variant: 'primary' }]
          });
          return;
        }

        var entry = LESSON_INDEX.get(id);
        var previous = prevEntry(id);
        var text = previous
          ? 'Сначала завершите урок ' + previous.lesson.code + ' «' + previous.lesson.title + '». После этого этот урок откроется автоматически.'
          : 'Этот урок пока недоступен. Завершите предыдущие уроки модуля.';
        if (!entry) return;
        showModal({
          icon: 'lock',
          title: 'Урок пока недоступен',
          text: text,
          actions: [{ label: 'Понятно', action: 'close-modal', variant: 'primary' }]
        });
      }

      function showProfileModal() {
        var done = completedCount();
        var percent = progressPercent();
        var following = nextIncompleteEntry();
        var nextText = following
          ? following.lesson.code + ' · ' + following.lesson.title
          : 'Курс завершён — можно повторить материал.';

        showModal({
          icon: 'user',
          tone: 'slate',
          title: 'Алексей К.',
          text: 'Слушатель курса «Заработок на аренде спецтехники». Прогресс хранится в этом браузере.',
          body: '<div class="mt-5 grid grid-cols-2 gap-2.5">'
            + '<div class="rounded-xl bg-slate-50 p-3 ring-1 ring-inset ring-slate-200/70"><p class="text-[9px] font-semibold uppercase tracking-[0.14em] text-slate-400">Пройдено</p><p class="mt-1 font-display text-lg font-extrabold text-slate-900">' + done + ' <span class="text-[11px] font-semibold text-slate-400">из ' + TOTAL + '</span></p></div>'
            + '<div class="rounded-xl bg-slate-50 p-3 ring-1 ring-inset ring-slate-200/70"><p class="text-[9px] font-semibold uppercase tracking-[0.14em] text-slate-400">Прогресс</p><p class="mt-1 font-display text-lg font-extrabold text-amber-600">' + percent + '%</p></div>'
            + '<div class="col-span-2 rounded-xl bg-slate-50 p-3 ring-1 ring-inset ring-slate-200/70"><p class="text-[9px] font-semibold uppercase tracking-[0.14em] text-slate-400">Следующий шаг</p><p class="mt-1 text-[11.5px] font-medium leading-snug text-slate-700">' + esc(nextText) + '</p></div>'
          + '</div>',
          actions: [{ label: 'Продолжить обучение', action: 'close-modal', variant: 'primary' }]
        });
      }

      function showResetModal() {
        showModal({
          icon: 'rotate-ccw',
          tone: 'rose',
          title: 'Сбросить прогресс?',
          text: 'Все отметки о завершённых уроках, ответы на домашние задания и черновики будут удалены. Это действие нельзя отменить.',
          actions: [
            { label: 'Отмена', action: 'close-modal' },
            { label: 'Сбросить', action: 'confirm-reset', variant: 'danger' }
          ]
        });
      }

      /* ---------- Уведомления ---------- */
      var TOAST_STYLES = {
        success: { icon: 'check', tone: 'bg-emerald-400/15 text-emerald-300' },
        info: { icon: 'info', tone: 'bg-sky-400/15 text-sky-300' },
        warn: { icon: 'alert-triangle', tone: 'bg-amber-400/15 text-amber-300' }
      };

      function showToast(message, type) {
        var root = document.getElementById('toastRoot');
        if (!root) return;
        var style = TOAST_STYLES[type] || TOAST_STYLES.success;
        var toast = document.createElement('div');
        toast.className = 'toast-item pointer-events-auto flex items-start gap-3 rounded-xl border border-white/10 bg-slate-950/95 px-4 py-3 shadow-2xl backdrop-blur';
        toast.innerHTML = '<span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-lg ' + style.tone + '"><i data-lucide="' + style.icon + '" class="h-3.5 w-3.5"></i></span>'
          + '<p class="min-w-0 flex-1 text-[11.5px] leading-relaxed text-slate-200">' + esc(message) + '</p>'
          + '<button type="button" data-action="close-toast" aria-label="Закрыть уведомление" class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded text-slate-500 transition hover:bg-white/5 hover:text-white"><i data-lucide="x" class="h-3 w-3"></i></button>';
        root.appendChild(toast);
        refreshIcons();

        setTimeout(function () {
          if (!toast.isConnected) return;
          toast.classList.add('toast-out');
          setTimeout(function () { toast.remove(); }, 260);
        }, 4600);
      }

      /* ---------- Действия ---------- */
      function selectLesson(id) {
        var entry = LESSON_INDEX.get(id);
        if (!entry) return;
        if (state.unlocked.indexOf(id) === -1) {
          showLockedModal('lesson', id);
          return;
        }
        var wasDrawerOpen = drawerOpen;
        closeDrawer(false);
        closeModal();
        state.currentLessonId = id;
        saveState();
        renderAll();
        var main = document.getElementById('mainScroll');
        if (main) main.scrollTo({ top: 0, behavior: 'smooth' });
        if (wasDrawerOpen) {
          var heading = document.getElementById('lessonTitle');
          if (heading) heading.focus({ preventScroll: true });
        }
      }

      function completeLesson(id) {
        var entry = LESSON_INDEX.get(id);
        if (!entry) return;
        if (state.completed.indexOf(id) === -1) state.completed.push(id);
        state.completedAt[id] = new Date().toISOString();

        var following = nextEntry(id);
        var message;

        if (following) {
          var moduleWasClosed = !isModuleUnlocked(following.module);
          var lessonWasLocked = state.unlocked.indexOf(following.lesson.id) === -1;
          if (lessonWasLocked) state.unlocked.push(following.lesson.id);
          expandedModules.add(following.module.id);

          if (moduleWasClosed) {
            message = 'Модуль ' + entry.module.id + ' завершён. Открыт новый модуль ' + following.module.id + ' «' + following.module.title + '».';
          } else if (lessonWasLocked) {
            message = 'Урок ' + entry.lesson.code + ' завершён. Открыт урок ' + following.lesson.code + '.';
          } else {
            message = 'Урок ' + entry.lesson.code + ' завершён. Прогресс сохранён.';
          }
        } else {
          message = 'Поздравляем! Вы завершили весь курс и прошли все ' + TOTAL + ' уроков.';
        }

        saveState();
        renderAll();

        requestAnimationFrame(function () {
          var homework = document.getElementById('homework');
          if (homework) homework.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        showToast(message, 'success');
      }

      function submitHomework(id) {
        if (!LESSON_INDEX.has(id)) return;
        if (state.currentLessonId !== id) return;
        if (state.completed.indexOf(id) !== -1) return;

        var field = $('[data-hw-input]');
        var value = field ? field.value.trim() : String(state.drafts[id] || '').trim();
        if (value) {
          state.answers[id] = value;
        }
        delete state.drafts[id];
        completeLesson(id);
      }

      function resetProgress() {
        state.currentLessonId = '1-1';
        state.completed = [];
        state.unlocked = DEFAULT_UNLOCKED.slice();
        state.answers = {};
        state.drafts = {};
        state.completedAt = {};
        expandedModules.clear();
        expandedModules.add(1);
        expandedModules.add(2);
        saveState();
        closeModal();
        renderAll();
        var main = document.getElementById('mainScroll');
        if (main) main.scrollTo({ top: 0, behavior: 'auto' });
        showToast('Прогресс курса сброшен. Можно начать заново.', 'info');
      }

      /* ---------- Видеоплеер (демо) ---------- */
      function stopPlayer() {
        if (player.timer) {
          clearInterval(player.timer);
          player.timer = null;
        }
        player.playing = false;
      }

      function updatePlayerUI() {
        var duration = player.duration || 1;
        var percent = Math.min(100, Math.max(0, (player.elapsed / duration) * 100));
        var bar = $('[data-player-bar]');
        var knob = $('[data-player-knob]');
        var time = $('[data-player-elapsed]');
        var overlay = $('[data-player-overlay]');
        var label = $('[data-player-label]');
        var playIcon = $('[data-player-play-icon]');
        var pauseIcon = $('[data-player-pause-icon]');
        var seek = $('[data-action="seek"]');

        if (bar) bar.style.width = percent + '%';
        if (knob) knob.style.left = percent + '%';
        if (time) time.textContent = formatTime(player.elapsed);
        if (overlay) {
          overlay.classList.toggle('opacity-0', player.playing);
          overlay.classList.toggle('pointer-events-none', player.playing);
        }
        if (playIcon) playIcon.classList.toggle('hidden', player.playing);
        if (pauseIcon) pauseIcon.classList.toggle('hidden', !player.playing);
        if (label) label.textContent = player.elapsed >= player.duration && !player.playing ? 'Смотреть снова' : 'Смотреть урок';
        if (seek) seek.setAttribute('aria-valuenow', String(Math.round(percent)));
      }

      function startPlayerTimer() {
        if (player.timer) {
          clearInterval(player.timer);
          player.timer = null;
        }
        player.playing = true;
        player.timer = setInterval(function () {
          player.elapsed = Math.min(player.duration, player.elapsed + 1);
          if (player.elapsed >= player.duration) {
            player.playing = false;
            if (player.timer) {
              clearInterval(player.timer);
              player.timer = null;
            }
          }
          updatePlayerUI();
        }, 1000);
      }

      function togglePlayer() {
        if (!player.duration) return;
        if (player.elapsed >= player.duration) player.elapsed = 0;
        player.active = true;
        player.playing = !player.playing;
        if (player.playing) {
          startPlayerTimer();
        } else {
          stopPlayer();
        }
        updatePlayerUI();
      }

      function seekPlayer(trigger, event) {
        var rect = trigger.getBoundingClientRect();
        if (!rect.width) return;
        var ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
        player.elapsed = Math.floor(player.duration * ratio);
        player.active = true;
        updatePlayerUI();
      }

      function toggleMute() {
        player.muted = !player.muted;
        var on = $('[data-mute-on]');
        var off = $('[data-mute-off]');
        if (on) on.classList.toggle('hidden', player.muted);
        if (off) off.classList.toggle('hidden', !player.muted);
      }

      function toggleFullscreen() {
        var stage = $('[data-player]');
        if (!stage) return;
        try {
          if (document.fullscreenElement) {
            if (document.exitFullscreen) document.exitFullscreen();
          } else if (stage.requestFullscreen) {
            stage.requestFullscreen();
          }
        } catch (error) {
          /* Полноэкранный режим может быть недоступен — интерфейс продолжает работать. */
        }
      }

      /* ---------- Мобильное меню ---------- */
      function openDrawer() {
        var sidebar = document.getElementById('sidebar');
        var backdrop = document.getElementById('drawerBackdrop');
        var trigger = $('[data-action="open-drawer"]');
        if (!sidebar) return;
        sidebar.classList.remove('-translate-x-full');
        sidebar.classList.add('translate-x-0');
        if (backdrop) backdrop.classList.remove('hidden');
        if (trigger) trigger.setAttribute('aria-expanded', 'true');
        drawerOpen = true;
        var closeButton = sidebar.querySelector('[data-action="close-drawer"]');
        if (closeButton) closeButton.focus({ preventScroll: true });
      }

      function closeDrawer(restoreFocus) {
        var sidebar = document.getElementById('sidebar');
        var backdrop = document.getElementById('drawerBackdrop');
        var trigger = $('[data-action="open-drawer"]');
        if (!sidebar) return;
        var wasOpen = drawerOpen;
        var active = document.activeElement;
        var focusWasInside = !!(active && sidebar.contains(active));
        sidebar.classList.add('-translate-x-full');
        sidebar.classList.remove('translate-x-0');
        if (backdrop) backdrop.classList.add('hidden');
        if (trigger) trigger.setAttribute('aria-expanded', 'false');
        drawerOpen = false;
        if (wasOpen && restoreFocus !== false && focusWasInside && trigger) {
          trigger.focus({ preventScroll: true });
        }
      }

      /* ---------- Делегирование событий ---------- */
      document.addEventListener('click', function (event) {
        var trigger = event.target.closest('[data-action]');
        if (!trigger) return;
        var action = trigger.getAttribute('data-action');

        switch (action) {
          case 'open-drawer':
            openDrawer();
            break;
          case 'close-drawer':
            closeDrawer();
            break;
          case 'toggle-module': {
            var moduleId = parseInt(trigger.getAttribute('data-module-id'), 10);
            var module = COURSE.modules.find(function (item) { return item.id === moduleId; });
            if (!module) break;
            if (!isModuleUnlocked(module)) {
              showLockedModal('module', moduleId);
              break;
            }
            if (expandedModules.has(moduleId)) {
              expandedModules.delete(moduleId);
            } else {
              expandedModules.add(moduleId);
            }
            renderSidebar();
            break;
          }
          case 'select-lesson':
            selectLesson(trigger.getAttribute('data-lesson-id'));
            break;
          case 'submit-hw':
            submitHomework(trigger.getAttribute('data-lesson-id'));
            break;
          case 'scroll-homework': {
            var homework = document.getElementById('homework');
            if (homework) homework.scrollIntoView({ behavior: 'smooth', block: 'start' });
            break;
          }
          case 'play-video':
            if (!player.playing) togglePlayer();
            break;
          case 'toggle-video':
            togglePlayer();
            break;
          case 'toggle-mute':
            toggleMute();
            break;
          case 'fullscreen':
            toggleFullscreen();
            break;
          case 'seek':
            seekPlayer(trigger, event);
            break;
          case 'profile':
            showProfileModal();
            break;
          case 'reset-progress':
            showResetModal();
            break;
          case 'confirm-reset':
            resetProgress();
            break;
          case 'close-modal':
            closeModal();
            break;
          case 'close-toast': {
            var toast = trigger.closest('.toast-item');
            if (toast) {
              toast.classList.add('toast-out');
              setTimeout(function () { toast.remove(); }, 240);
            }
            break;
          }
          default:
            break;
        }
      });

      document.addEventListener('input', function (event) {
        var field = event.target.closest('[data-hw-input]');
        if (!field) return;
        var id = state.currentLessonId;
        state.drafts[id] = field.value;
        var counter = $('[data-hw-count]');
        if (counter) counter.textContent = field.value.length + ' / ' + MAX_ANSWER;
        scheduleSave();
      });

      document.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape') return;
        var root = document.getElementById('modalRoot');
        if (root && root.children.length) {
          closeModal();
          return;
        }
        if (drawerOpen) closeDrawer();
      });

      window.addEventListener('resize', function () {
        if (drawerOpen && window.innerWidth >= 1024) closeDrawer(false);
      });

      window.addEventListener('beforeunload', saveState);

      /* ---------- Старт ---------- */
      loadState();
      initExpanded();
      renderAll();
      saveState();

      var drawerTrigger = $('[data-action="open-drawer"]');
      if (drawerTrigger) drawerTrigger.setAttribute('aria-expanded', 'false');
      var toastRoot = document.getElementById('toastRoot');
      if (toastRoot) toastRoot.setAttribute('aria-live', 'polite');
    })();
  </script>
</body>
</html>
